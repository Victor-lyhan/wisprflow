<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dentascribe — live dental transcription</title>
<style>
  :root {
    --bg:#0f1115; --panel:#171a21; --line:#262b35; --text:#e6e9ef; --dim:#8b93a3;
    --accent:#5eb3f6; --live:#f0b45e; --ok:#6ddba0; --flag:#f2777a;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f7f8fa; --panel:#fff; --line:#e2e5ea; --text:#1a1d23; --dim:#6b7280;
            --accent:#1f6feb; --live:#a15c00; --ok:#137a4a; --flag:#c0362c; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:15px/1.55 system-ui,-apple-system,sans-serif; }
  header { display:flex; align-items:center; gap:14px; flex-wrap:wrap;
           padding:12px 20px; border-bottom:1px solid var(--line); }
  h1 { font-size:15px; margin:0; font-weight:600; }
  label { color:var(--dim); font-size:12px; }
  select, button {
    font:inherit; font-size:13px; padding:7px 12px; border-radius:7px;
    border:1px solid var(--line); background:var(--panel); color:var(--text);
  }
  select { max-width:min(340px, 45vw); }
  button { cursor:pointer; font-weight:600; }
  button.primary { background:var(--accent); color:#fff; border-color:transparent; }
  button.primary.stop { background:var(--flag); }
  button:disabled { opacity:.45; cursor:default; }
  #dot { width:9px; height:9px; border-radius:50%; background:var(--dim); }
  #dot.on { background:var(--flag); animation:pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity:.25; } }
  .note { padding:8px 20px; background:var(--panel); border-bottom:1px solid var(--line);
          color:var(--dim); font-size:12.5px; }
  main { display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--line);
         height:calc(100vh - 104px); }
  .col { background:var(--bg); display:flex; flex-direction:column; min-height:0; }
  .col.split { display:grid; grid-template-rows:1fr 1fr; gap:1px; background:var(--line); }
  section { background:var(--bg); display:flex; flex-direction:column; min-height:0; }
  .head { display:flex; align-items:center; gap:10px; padding:9px 16px;
          border-bottom:1px solid var(--line); color:var(--dim);
          font-size:11.5px; text-transform:uppercase; letter-spacing:.7px; }
  .head .sp { flex:1; }
  .head button { padding:4px 10px; font-size:11.5px; text-transform:none; letter-spacing:0; }
  .body { padding:14px 16px; overflow:auto; flex:1; min-height:0; }
  .u { margin-bottom:9px; padding-left:11px; border-left:2px solid var(--line); }
  .u.final { border-left-color:var(--ok); }
  .u.partial { border-left-color:var(--live); color:var(--dim); font-style:italic; }
  .t { font-variant-numeric:tabular-nums; color:var(--dim); font-size:11px;
       font-family:var(--mono); margin-right:8px; }
  textarea { flex:1; width:100%; border:0; resize:none; padding:14px 16px;
             background:var(--bg); color:var(--text); font:14px/1.6 system-ui,sans-serif;
             outline:none; min-height:0; }
  pre { margin:0; font-family:var(--mono); font-size:11.5px; line-height:1.5;
        white-space:pre-wrap; word-break:break-word; }
  .empty { color:var(--dim); font-style:italic; }
  .flag { color:var(--flag); }
  @media (max-width:960px) { main { grid-template-columns:1fr; height:auto; }
                             .col.split { grid-template-rows:auto auto; }
                             .body, textarea { min-height:220px; } }
</style>
</head>
<body>
<header>
  <h1>dentascribe</h1>
  <label for="device">Input</label>
  <select id="device"><option>loading…</option></select>
  <button id="refresh" title="Re-scan audio devices">↻</button>
  <span style="flex:1"></span>
  <span id="dot"></span>
  <span class="sub" id="status" style="color:var(--dim);font-size:13px">idle</span>
  <button id="btn" class="primary">Start listening</button>
</header>

<div class="note">
  Live text is <strong>provisional</strong> and is revised as more speech arrives.
  Only the final transcript — produced when you stop — is corrected and authoritative.
</div>

<main>
  <section class="col">
    <div class="head">Live<span class="sp"></span><span id="counts"></span></div>
    <div class="body" id="live"><div class="empty">Pick an input, press start, and speak.</div></div>
  </section>

  <div class="col split">
    <section>
      <div class="head">
        Transcript
        <span class="sp"></span>
        <button id="copy">Copy</button>
        <button id="dl-txt">Download .txt</button>
      </div>
      <textarea id="text" placeholder="The final transcript appears here when you stop. It is editable — correct anything before saving."></textarea>
    </section>
    <section>
      <div class="head">
        JSON
        <span class="sp"></span>
        <button id="dl-json">Download .json</button>
      </div>
      <div class="body"><pre id="json" class="empty">Events appear here as they arrive.</pre></div>
    </section>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const [btn, live, out, dot, statusEl, deviceSel, textArea, counts] =
  ['btn','live','json','dot','status','device','text','counts'].map($);

let socket = null, running = false, partial = null, complete = null;
const records = [];

// -- devices -----------------------------------------------------------------

async function loadDevices() {
  deviceSel.innerHTML = '';
  try {
    const d = await (await fetch('/devices')).json();
    if (d.error || !d.devices?.length) {
      deviceSel.innerHTML = `<option value="">${d.error ?? 'no input devices'}</option>`;
      return;
    }
    // The server captures, so these are the *server's* devices. Anything the OS
    // exposes as an input works here — built-in mic, AirPods, a USB interface, or
    // a loopback device such as BlackHole for capturing system audio.
    const def = d.default?.name;
    for (const dev of d.devices) {
      const opt = document.createElement('option');
      opt.value = dev.index;
      opt.textContent = dev.name + (dev.name === def ? ' (default)' : '');
      if (dev.name === def) opt.selected = true;
      deviceSel.appendChild(opt);
    }
  } catch {
    deviceSel.innerHTML = '<option value="">could not reach server</option>';
  }
}
loadDevices();
$('refresh').onclick = loadDevices;

// -- rendering ---------------------------------------------------------------

const clock = s => `${String(Math.floor(s/60)).padStart(2,'0')}:${(s%60).toFixed(1).padStart(4,'0')}`;

function pushRecord(rec) {
  records.push(rec);
  out.textContent = records.map(r => JSON.stringify(r, null, 2)).join('\n');
  out.classList.remove('empty');
  out.parentElement.scrollTop = out.parentElement.scrollHeight;
  counts.textContent = `${records.filter(r=>r.type==='final').length} confirmed`;
}

function addLine(rec, provisional) {
  if (live.querySelector('.empty')) live.innerHTML = '';
  const el = document.createElement('div');
  el.className = 'u ' + (provisional ? 'partial' : 'final');
  el.innerHTML = `<span class="t">${clock(rec.start)}</span>${escapeHtml(rec.text)}`;
  live.appendChild(el);
  live.scrollTop = live.scrollHeight;
  return el;
}

const escapeHtml = s => s.replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function handle(rec) {
  pushRecord(rec);
  if (rec.type === 'partial') {
    if (partial) partial.remove();
    partial = addLine(rec, true);
    // Show provisional text in the box too, so the operator sees words appear —
    // it is replaced wholesale by the corrected transcript on stop.
    textArea.value = liveText() + (rec.text ? '\n\n' + rec.text : '');
  } else if (rec.type === 'final') {
    if (partial) { partial.remove(); partial = null; }
    addLine(rec, false);
    textArea.value = liveText();
  } else if (rec.type === 'complete') {
    if (partial) { partial.remove(); partial = null; }
    complete = rec;
    live.innerHTML = '';
    const t = rec.corrected ?? rec.verbatim;
    (t.utterances ?? []).forEach(u => addLine(u, false));
    textArea.value = (t.utterances ?? []).map(u => u.text.trim()).join('\n\n');
    if (rec.flags?.length) {
      const el = document.createElement('div');
      el.className = 'u flag';
      el.innerHTML = '<strong>Verify:</strong> ' + rec.flags
        .map(f => `“${escapeHtml(f.term)}” — could be ${escapeHtml(f.alternatives.join(' / '))}`)
        .join('; ');
      live.appendChild(el);
    }
    const n = (t.utterances ?? []).length;
    statusEl.textContent = `complete — ${n} utterance${n===1?'':'s'}, ${rec.edits.length} correction${rec.edits.length===1?'':'s'}`;
  } else if (rec.type === 'error') {
    statusEl.textContent = 'error';
    live.innerHTML = `<div class="u flag">${escapeHtml(rec.message)}</div>`;
  }
}

const liveText = () => records.filter(r => r.type === 'final')
                              .map(r => r.text.trim()).join('\n\n');

// -- export ------------------------------------------------------------------

function download(name, text, mime) {
  const url = URL.createObjectURL(new Blob([text], {type: mime}));
  const a = document.createElement('a');
  a.href = url; a.download = name;
  a.click();
  URL.revokeObjectURL(url);
}

const stamp = () => new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');

// Saves what is in the box, not the last received record, so operator edits are
// what gets written.
$('dl-txt').onclick = () => {
  if (!textArea.value.trim()) { statusEl.textContent = 'nothing to save'; return; }
  download(`transcript-${stamp()}.txt`, textArea.value, 'text/plain;charset=utf-8');
};

$('dl-json').onclick = () => {
  if (!records.length) { statusEl.textContent = 'nothing to save'; return; }
  download(`transcript-${stamp()}.json`,
           JSON.stringify(complete ?? records, null, 2), 'application/json');
};

$('copy').onclick = async () => {
  if (!textArea.value.trim()) return;
  try {
    await navigator.clipboard.writeText(textArea.value);
    const b = $('copy'); b.textContent = 'Copied'; setTimeout(() => b.textContent = 'Copy', 1200);
  } catch { textArea.select(); }
};

// -- session -----------------------------------------------------------------

function setRunning(on) {
  running = on;
  dot.classList.toggle('on', on);
  btn.textContent = on ? 'Stop' : 'Start listening';
  btn.classList.toggle('stop', on);
  deviceSel.disabled = on;
}

btn.onclick = () => {
  if (running) {
    btn.disabled = true;
    statusEl.textContent = 'finalizing…';
    if (socket?.readyState === WebSocket.OPEN) socket.send('stop');
    setRunning(false);
    return;
  }

  records.length = 0; complete = null; partial = null;
  live.innerHTML = '<div class="empty">Listening…</div>';
  out.textContent = ''; out.classList.add('empty');
  textArea.value = ''; counts.textContent = '';

  const device = deviceSel.value;
  const qs = device === '' ? '' : `?device=${encodeURIComponent(device)}`;
  socket = new WebSocket(`ws://${location.host}/stream${qs}`);

  socket.onopen = () => { setRunning(true); statusEl.textContent = 'listening'; };
  socket.onmessage = e => handle(JSON.parse(e.data));
  socket.onerror = () => { statusEl.textContent = 'connection failed'; };
  socket.onclose = () => {
    setRunning(false);
    btn.disabled = false;
    if (statusEl.textContent === 'finalizing…') statusEl.textContent = 'idle';
  };
};
</script>
</body>
</html>

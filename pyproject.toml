[project]
name = "flowscribe"
version = "0.1.0"
description = "Modular, fully-local speech-to-text pipeline for dental clinical environments"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# Core stays deliberately light: contracts, orchestration, config, CLI.
# Every inference engine lives behind an optional extra so a consuming project
# only pays for the backends it actually uses.
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "numpy>=1.26",
    "av>=12.0",          # audio decode/resample without an external ffmpeg binary (matters on Windows)
    "typer>=0.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0"]
parakeet = ["onnx-asr>=0.6", "onnxruntime>=1.18"]
vad = ["onnx-asr>=0.6", "onnxruntime>=1.18"]
diarize = ["pyannote.audio>=3.1", "torch>=2.2", "torchaudio>=2.2"]
llm = ["httpx>=0.27"]
mic = ["sounddevice>=0.4"]
ui = ["fastapi>=0.110", "uvicorn>=0.29", "websockets>=12.0"]
mlx = ["mlx-whisper>=0.4"]           # Apple Silicon dev only; never a production path
denoise = ["deepfilternet>=0.5"]
eval = ["jiwer>=3.0", "pyannote.metrics>=3.2"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "build>=1.2",
]

[project.scripts]
flowscribe = "flowscribe.cli:app"

# Backends ship as entry points so they resolve through the same discovery path
# that external projects use to register their own. Nothing is special-cased.
[project.entry-points."flowscribe.asr"]
faster-whisper = "flowscribe.asr.faster_whisper_engine:FasterWhisperEngine"
parakeet-onnx = "flowscribe.asr.parakeet_onnx:ParakeetOnnxEngine"

[project.entry-points."flowscribe.vad"]
silero = "flowscribe.vad.silero:SileroVAD"

[project.entry-points."flowscribe.sink"]
json = "flowscribe.sinks.builtin:JsonSink"
jsonl = "flowscribe.sinks.builtin:JsonlSink"
text = "flowscribe.sinks.builtin:TextSink"
srt = "flowscribe.sinks.builtin:SrtSink"
vtt = "flowscribe.sinks.builtin:VttSink"

[project.entry-points."flowscribe.diarizer"]
# "passthrough" is canonical; "null" is kept as an alias because a bare
# `backend: null` in YAML parses as None, not the string "null".
passthrough = "flowscribe.diarize.null:NullDiarizer"
null = "flowscribe.diarize.null:NullDiarizer"
pyannote = "flowscribe.diarize.pyannote_diarizer:PyannoteDiarizer"

[project.entry-points."flowscribe.corrector"]
passthrough = "flowscribe.correct.null:NullCorrector"
null = "flowscribe.correct.null:NullCorrector"
ollama = "flowscribe.correct.ollama:OllamaCorrector"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flowscribe"]
# The demo page is data, not code; name it so no build backend drops it.
artifacts = ["src/flowscribe/static/*.html", "src/flowscribe/dental/data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put the repository root on sys.path so `from tests.conftest import ...`
# resolves. Without it that import works only where sys.path happens to
# already contain the root -- it failed in a clean CI checkout on every
# platform while passing locally.
pythonpath = ["."]
markers = [
    "slow: requires downloading or running a real model",
    "needs_network: exercises provisioning, not inference",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true

# Optional inference backends ship no type information. Their imports are
# already guarded at runtime by the registry's MissingDependency handling, so
# silencing them here loses nothing that is actually checkable.
[[tool.mypy.overrides]]
module = [
    "faster_whisper.*",
    "pyannote.*",
    "torch.*",
    "av.*",
    "jiwer.*",
    "onnx_asr.*",
    "onnxruntime.*",
    "sounddevice.*",
    "uvicorn.*",
]
ignore_missing_imports = true

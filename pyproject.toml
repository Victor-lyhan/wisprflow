[project]
name = "dentascribe"
version = "0.1.0"
description = "Fully-local speech-to-text for dental clinical audio, with domain correction"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Victor Han" }]
keywords = [
    "speech-recognition",
    "asr",
    "transcription",
    "dental",
    "dentistry",
    "clinical",
    "medical",
    "whisper",
    "parakeet",
    "offline",
    "privacy",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Typing :: Typed",
]

# Core stays deliberately light: contracts, orchestration, config, CLI.
# Every inference engine lives behind an optional extra so a consuming project
# only pays for the backends it actually uses.
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "numpy>=1.26",
    "av>=12.0",          # audio decode/resample without an external ffmpeg binary (matters on Windows)
    "typer>=0.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0"]
parakeet = ["onnx-asr>=0.6", "onnxruntime>=1.18"]
vad = ["onnx-asr>=0.6", "onnxruntime>=1.18"]
llm = ["httpx>=0.27"]
mic = ["sounddevice>=0.4"]
ui = ["fastapi>=0.110", "uvicorn>=0.29", "websockets>=12.0"]
mlx = ["mlx-whisper>=0.4"]           # Apple Silicon dev only; never a production path
denoise = ["deepfilternet>=0.5"]
eval = ["jiwer>=3.0", "pyannote.metrics>=3.2"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "build>=1.2",
]

[project.urls]
Homepage = "https://github.com/Victor-lyhan/dentascribe"
Repository = "https://github.com/Victor-lyhan/dentascribe"
Issues = "https://github.com/Victor-lyhan/dentascribe/issues"
Changelog = "https://github.com/Victor-lyhan/dentascribe/releases"

[project.scripts]
dentascribe = "dentascribe.cli:app"

# Backends ship as entry points so they resolve through the same discovery path
# that external projects use to register their own. Nothing is special-cased.
[project.entry-points."dentascribe.asr"]
faster-whisper = "dentascribe.asr.faster_whisper_engine:FasterWhisperEngine"
parakeet-onnx = "dentascribe.asr.parakeet_onnx:ParakeetOnnxEngine"

[project.entry-points."dentascribe.vad"]
silero = "dentascribe.vad.silero:SileroVAD"

[project.entry-points."dentascribe.sink"]
json = "dentascribe.sinks.builtin:JsonSink"
jsonl = "dentascribe.sinks.builtin:JsonlSink"
text = "dentascribe.sinks.builtin:TextSink"
srt = "dentascribe.sinks.builtin:SrtSink"
vtt = "dentascribe.sinks.builtin:VttSink"

[project.entry-points."dentascribe.corrector"]
passthrough = "dentascribe.correct.null:NullCorrector"
null = "dentascribe.correct.null:NullCorrector"
ollama = "dentascribe.correct.ollama:OllamaCorrector"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
# Ship what is needed to build and test from source, and nothing else. Without
# an explicit list, hatchling includes the whole tree -- including any local
# recordings under data/.
include = ["src/", "tests/", "scripts/", "configs/", "docs/", "README.md", "LICENSE", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/dentascribe"]
# The demo page is data, not code; name it so no build backend drops it.
artifacts = ["src/dentascribe/static/*.html", "src/dentascribe/dental/data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put the repository root on sys.path so `from tests.conftest import ...`
# resolves. Without it that import works only where sys.path happens to
# already contain the root -- it failed in a clean CI checkout on every
# platform while passing locally.
pythonpath = ["."]
markers = [
    "slow: requires downloading or running a real model",
    "needs_network: exercises provisioning, not inference",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true

# Optional inference backends ship no type information. Their imports are
# already guarded at runtime by the registry's MissingDependency handling, so
# silencing them here loses nothing that is actually checkable.
[[tool.mypy.overrides]]
module = [
    "faster_whisper.*",
    "torch.*",
    "av.*",
    "jiwer.*",
    "onnx_asr.*",
    "onnxruntime.*",
    "sounddevice.*",
    "uvicorn.*",
]
ignore_missing_imports = true
